<!DOCTYPE html>
<html>
  <head>
    <!--
      Loaded as an external script on purpose: the shell serves every extension
      page with Chrome's MV3 CSP default (`script-src 'self'`) unless the
      manifest declares its own policy, and inline scripts do not survive that
      policy (docs/LIMITATIONS.md §Security). panel.html has no inline script.
    -->
    <link rel="stylesheet" href="/panel.css" />
    <script src="/panel.js" defer></script>
  </head>
  <body>
    <h1 id="heading">Basic devtools panel</h1>
    <!-- filled by panel.js from chrome.i18n (see _locales/) -->
    <div id="i18n-demo"></div>
    <p>Panel page loaded: <span id="loaded-at"></span></p>
    <p id="theme"></p>
    <ul id="results"></ul>
    <!-- filled by the devtools page's Panel.onShown / onHidden listeners (devtools.js) -->
    <h2>Panel events</h2>
    <ul id="panel-events"></ul>
    <!-- same-extension frame: the runtime-messaging responder -->
    <iframe src="/ping.html" style="display: none"></iframe>
  </body>
</html>
