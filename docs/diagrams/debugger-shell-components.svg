.buslabel{font-size:12px;font-weight:600;fill:var(--ipc)}
.call{fill:none;stroke:var(--call);stroke-width:1.4}
.cdp{fill:none;stroke:var(--cdp);stroke-width:3}
.file{fill:none;stroke:var(--file);stroke-width:1.4;stroke-dasharray:5 4}
.disk{fill:var(--up);stroke:var(--upb);stroke-width:1.4}
.elabel{font-size:11.5px;fill:var(--muted)}
.clabel{font-size:12px;font-weight:600;fill:var(--cdp)}
